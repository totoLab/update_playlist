[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "update-playlist"
version = "0.2.1"
authors = [
  { name="Antonio Labate", email="antoniolabate19@gmail.com" },
]
description = "A modular playlist manager to download and manage Spotify playlists."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "spotdl>=4.2,<5",
    # status page; already pulled in by spotdl, listed so we don't rely on that
    "fastapi",
    "uvicorn",
]

[project.urls]
"Homepage" = "https://github.com/totolab/update_playlist"
"Bug Tracker" = "https://github.com/totolab/update_playlist/issues"

[project.scripts]
update-playlist = "update_playlist.main:main"

[tool.setuptools.package-data]
update_playlist = ["*.html"]
