services:
  update-playlist:
    build: .
    image: update-playlist
    init: true  # python as PID 1 ignores SIGTERM; tini makes `docker compose down` stop it promptly
    env_file:
      - path: .env
        required: false
    volumes:
      - ${MUSIC_HOST_DIR:-./music}:/music
      - ./data:/data
    command: ["--web", "39501"]  # syncs every 24h; change it on the status page
    ports:
      - "39501:39501"  # status page, no auth: keep it on a trusted network
    restart: unless-stopped
